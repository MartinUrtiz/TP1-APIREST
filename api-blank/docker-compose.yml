services:
  postgres:
    image: postgres:17-alpine
    container_name: api-blank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_blank}
      POSTGRES_USER: ${POSTGRES_USER:-api_blank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_blank123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api_blank} -d ${POSTGRES_DB:-api_blank}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
