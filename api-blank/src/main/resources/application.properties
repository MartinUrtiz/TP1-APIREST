spring.application.name=api-blank

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------------------------------------
# PostgreSQL (los valores por defecto coinciden con docker-compose.yml)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_blank}
spring.datasource.username=${DB_USER:api_blank}
spring.datasource.password=${DB_PASSWORD:api_blank123}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo maneja Flyway, no Hibernate.
# validate comprueba que las tablas/columnas existen y coinciden con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway aplica las migraciones de src/main/resources/db/migration al arrancar
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------
# JWT (los valores por defecto son sólo para correr en local;
# en Render van por variables de entorno: JWT_SECRET, JWT_EXPIRATION_MS)
# ------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:api-blank-clave-secreta-local-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
